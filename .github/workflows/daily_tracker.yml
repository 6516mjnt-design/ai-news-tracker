name: Daily AI News Collector

on:
  schedule:
    - cron: '0 22 * * *'  # 日本時間 朝7:00（動かなくても手動実行できるので残してOK）
  workflow_dispatch:      # ★手動実行ボタンを有効化

jobs:
  collect-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # ★リポジトリへの書き込み権限を明示
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas

      - name: Run collector script
        run: python script.py

      - name: Commit and push updated CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ai_news_stats.csv
          git commit -m "Update AI news stats [skip ci]" || exit 0
          git push