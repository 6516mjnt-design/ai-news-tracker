name: Daily AI News Tracker

on:
  schedule:
    # UTC時間で指定（JST 23:00 は UTC 14:00）
    - cron: '0 14 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tracking script
      run: python script.py

    - name: Commit and push updated CSV
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]"
        git add ai_news_stats.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily AI stats [skip ci]" && git push)