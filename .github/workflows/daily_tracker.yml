name: Daily AI News Tracker

on:
  schedule:
    # 毎日 日本時間 午前7:00（UTC 22:00）に自動実行
    - cron: '18 21 * * *' # 日本時間 06:18（UTC 21:18）に変更
  workflow_dispatch: # GitHubの画面から手動実行も可能にする設定

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み（Push）権限を許可

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas

      - name: 集計スクリプトの実行
        run: python script.py

      - name: 変更をコミットしてPush
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ai_news_stats.csv
          
          # 変更がある場合のみコミット＆Pushする
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily AI news stats [skip ci]" && git push)
