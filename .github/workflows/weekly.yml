name: Weekly AI News Report Generator

on:
  schedule:
    # 毎週月曜日の JST 午前 7:00（UTC 日曜日 22:00）に自動起動
    - cron: '0 22 * * 0'
  workflow_dispatch: # Actions タブから手動実行ボタンを有効化

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 週刊HTMLレポートの生成 (generate_weekly_html.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_weekly_html.py

      - name: 生成した docs/AI_News_Weekly.html をコミット & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/AI_News_Weekly.html
          git commit -m "Auto-generate weekly AI news report (AI_News_Weekly.html) [skip ci]" || exit 0
          git push