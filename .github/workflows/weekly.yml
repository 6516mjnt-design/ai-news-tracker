name: Weekly AI News Raw Generator

on:
  schedule:
    - cron: '0 22 * * 0'  # 毎週日曜日 UTC 22:00（日本時間 月曜 朝7:00）
  workflow_dispatch:      # ★手動実行ボタンを有効化

jobs:
  generate-raw-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # ★リポジトリへの書き込み権限を明示
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run raw extraction script
        run: python generate_weekly_html.py

      - name: Commit and push weekly_news_raw.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add weekly_news_raw.txt
          git commit -m "Update weekly_news_raw.txt [skip ci]" || exit 0
          git push